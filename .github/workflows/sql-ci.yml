name: SQL Engine CI Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-sql:
    name: Validate T-SQL Scripts on MSSQL 2022
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ArchitectPassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ArchitectPassword123!' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install SQL Server Client Tools (sqlcmd)
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Test Database Tips and Tricks Functions & Procedures
        run: |
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Database Tips and Tricks/Calendar Table/FnReturnCalendarTable.sql"
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Database Tips and Tricks/Subtracting Two Dates/FnDateDiffPartsChar.sql"
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Database Tips and Tricks/Subtracting Two Dates/FnDateDiffPartsTable.sql"
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Database Tips and Tricks/Pivoting Data/SpPivotData.sql"

      - name: Test Azure ADF Demo DDL Scripts
        run: |
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Microsoft Azure/Data Factory Metadata Demo/Data Factory SQL DDL Scripts.sql"
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Microsoft Azure/Databricks Spark Hive Demo/SuppliersAndPartsDDL.sql"

      - name: Test Advanced SQL Puzzles DDL
        run: |
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Advanced SQL Puzzles/Advanced SQL Puzzles DDL.sql"

